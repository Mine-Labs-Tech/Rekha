[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minelabs-rekha"
version = "0.1.0"
description = "High-Performance System-1 Control Plane and Gateway for Production RAG"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Mine Labs", email = "dev@minelabs.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "laya>=0.3.0",
    "pydantic>=2.0.0",
    "cachetools>=5.3.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "rich>=13.0.0",
    "streamlit>=1.30.0",
]

[project.urls]
Homepage = "https://github.com/mine-labs/rekha"
Documentation = "https://github.com/mine-labs/rekha#readme"
Repository = "https://github.com/mine-labs/rekha.git"

[tool.hatch.build.targets.sdist]
only-include = ["rekha", "README.md", "pyproject.toml", "Architecture.md"]

[tool.hatch.build.targets.wheel]
packages = ["rekha"]
